# =========================================================================
#  Nginx для сайта «Фрейя» на Timeweb Cloud.
#
#  Куда положить:
#     /etc/nginx/sites-available/freya  (и симлинк в sites-enabled)
#
#  Замените example.com на свой домен, потом выполните:
#     nginx -t && systemctl reload nginx
#     certbot --nginx -d example.com -d www.example.com
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Сертификат выпишет certbot — он же добавит редирект на https
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
}

# Общие настройки прокси для бекенда (если файла proxy_params нет —
# скопируйте блок location ниже целиком вместо include)
#
#   proxy_http_version 1.1;
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;

# ------------------------- Рабочий блок HTTPS -------------------------
# После certbot весь блок ниже будет работать как основной.
# certbot сам пропишет ssl_certificate и ssl_certificate_key.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Статика отдаётся напрямую из релиза — без участия Node
    root /srv/freya/current/public;
    index index.html;

    # Видео и фото лежат в S3, но каталог и загрузки идут через бекенд,
    # поэтому разрешаем большое тело запроса
    client_max_body_size 400m;
    client_body_timeout 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Безопасность по минимуму
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------------------------- API и загрузки ----------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # видео течёт сразу в Node, а не копится на диске
        proxy_read_timeout 30m;       # пережатие ролика может занять время
        proxy_send_timeout 30m;
    }

    # Локальные медиа — только если работаете без S3 (STORAGE_DRIVER=local)
    location /media/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Каталог товаров никогда не кэшируем: правка видна сразу
    location = /catalog.json {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }

    # ------------------------------ Статика ------------------------------
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /admin.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Маршруты сайта живут после #, поэтому всё неизвестное — на index.html
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
